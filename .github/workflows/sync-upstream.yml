
name: Sync all branches from upstream

on:
  schedule:
    - cron: "0 3 * * *" # Every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/ORIGINAL_OWNER/REPO.git

      - name: Fetch upstream branches
        run: |
          git fetch upstream

      - name: Push all upstream branches to fork
        run: |
          git push origin \
            '+refs/remotes/upstream/*:refs/heads/*'

